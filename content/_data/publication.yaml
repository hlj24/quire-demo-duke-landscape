# Title & Description
title: Building Duke's Landscape
subtitle: How the Olmsted Brothers Firm Imagined Duke
reading_line:
short_title:

description:
  one_line:
  full: "When J.B. Duke and William Preston Few began planning for the construction of a new university in Durham, North Carolina, they knew they needed not only an architect to design the buildings, but also a *landscape* architect to design the spaces around and between the buildings. These landscape designs would impact how people experienced the campus. With grand visions in mind, Duke and Few looked to the very best in American landscape architecture: the Olmsted Brothers firm."


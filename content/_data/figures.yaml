figure_list:

  - id: "olmstedbros"
    src: figures/001_OlmstedOrg_OlmstedBrothersFirm_G06-087_F.jpg
    caption: "Members of the Olmsted Brothers Firm, photograph undated."
    credit: "[Courtesy of the Olmsted Network](https://olmsted.org/colleagues-firm/olmsted-firm/)"
    alt: "A group of white men stand on steps holding surveying equipment, most of them looking at the camera."

  - id: "centralpark"
    src: figures/002_IIIF_NYCPL_CentralParkDesign_K1UAH83PSkOQ08S5dQX92gh.jpg
    zoom: true
    caption: "'Map of the Central Park' in New York City as designed by Olmsted and Vaux."
    credit: "Lionel Pincus and Princess Firyal Map Division, The New York Public Library. ['Map of the Central Park'](https://digitalcollections.nypl.org/items/4e6a6080-3569-0134-549e-00505686a51c) New York Public Library Digital Collections. Accessed January 13, 2025."
    alt: "Long format map, in color, of the Olmsted Brothers design for Central Park."

  - id: "JohnCharles"
    src: figures/003_OlmstedOrg_JohnCharles_Olmsted_Sons_3.jpg
    caption: "John Charles Olmsted."
    credit: "[Olmsted Network.](https://olmsted.org/colleagues-firm/john-charles-olmsted/)"
    alt: "A white man sat drawing at a drafting table."

  - id: "FrederickJr"
    src: figures/004_BaltimoreHeritage_frederick-law-olmsted-jr-1024x817.jpg
    caption: "Frederick Law Olmsted, Jr."
    credit: "[Library of Congress via Baltimore Heritage.](https://baltimoreheritage.org/frederick-law-olmsted-jr-and-the-plan-for-guilford/)"
    alt: "A white man with a pipe sat writing and studying maps."

  - id: "3men"
    src: figures/005_OlmstedNatHistSite_PercivalGallagher_Olmsted_Sons2-960x700-1.png
    caption: "Left to right: James Frederick Dawson, Frederick Law Olmsted Jr. and Percival Gallagher."   
    credit: "['People.'](https://www.nps.gov/frla/learn/historyculture/people.htm.) Frederick Law Olmsted National Historic Site Massachusetts."
    alt: "Three white men in suits conversing over an unknown object or document. The man the left looks down and to the right at the unknown object. The man in the middle looks to the man on the right. The man on the right looks straight down at the unknown object."

  - id: "train"
    src: figures/006_OlmstedORGO_TrainEnteringEastCampus_15055437072_116d4d02cc_o.jpg
    caption: "A construction train on temporary tracks arrives in the middle of Trinity College's original campus."
    credit: Courtesy of the United States Department of the Interior, National Park Service, Frederick Law Olmsted National Historic Site.
    alt: "A short train on tracks in the middle of an early twentieth century college campus. Students stand off to the left watching."

  - id: "WestDuke"
    src: figures/007_annotated_Olmsted_ParkwayValleyTowardWomansCollege_14869238177_ee8194b78e_o.png
    caption: "West Duke building viewed from a field to the south. ca. 1924."
    credit: Courtesy of the United States Department of the Interior, National Park Service, Frederick Law Olmsted National Historic Site.
    alt: "A sepiatone photograph of a field in the foreground, houses in the middle, and a large campus building in the background, annotated in with an arrow in blue and the words 'West Duke building'."

  - id: "RigsbeeRd1"
    src: figures/008_OlmstedORGO_RigsbeeRdSandyCreekTowardWestCampus_14869138710_d905ba2cd0_o.jpg
    caption: "Rigsbee Rd, future Duke University Rd. ca. 1924."
    credit: Courtesy of the United States Department of the Interior, National Park Service, Frederick Law Olmsted National Historic Site.
    alt: "A dirt road with a log cabin and larger house to its right and fields behind. A hill and tree line rise in the background."

  - id: "RigsbeeRd2"
    src: figures/009_OlmstedORGO_RigsbeeRd_14867547048_02684b3b99_o.jpg
    caption: "Rigsbee Rd, future Duke University Rd. ca. 1924."
    credit: Courtesy of the United States Department of the Interior, National Park Service, Frederick Law Olmsted National Historic Site.
    alt: "Looking directly down a dirt road, which slopes down before climbing the next hill in the distance. Trees on either side."

  - id: "RigsbeeFarm"
    src: figures/010_OlmstedORGO_RigsbeeFarmDriveway_14867581157_47f3ffda0a_o.jpg
    caption: "Rigsbee Farm, future Duke University athletics facilities. ca. 1924."
    credit: Courtesy of the United States Department of the Interior, National Park Service, Frederick Law Olmsted National Historic Site.
    alt: "A model T car sits at the end of a driveway that slopes up to a farm house and barns at the top of a hill."

  - id: "AfricanAmericanHome"
    src: figures/011_OlmstedORGO_AfricanAmericanHome_14869139620_57e0c1ac1e_o.jpg
    caption: "Possible African American family home. ca. 1924."
    credit: Courtesy of the United States Department of the Interior, National Park Service, Frederick Law Olmsted National Historic Site.
    alt: "The back of a long cabin behind several trees. A wagon sits under an overhang, and the silhouette of a possible cow is in the distance."

  - id: "RuralDurham"
    src: figures/012_OlmstedORGO_RdwTelephoneEquipment_15052739231_5e890925b4_o.jpg
    caption: "Looking from a field and dirt road down toward Durham homes. ca. 1924."
    credit: Courtesy of the United States Department of the Interior, National Park Service, Frederick Law Olmsted National Historic Site.
    alt: "Field and dirt road with surveying equipment in the foreground and houses visible in the distance."

  - id: "Baldwin"
    src: figures/013_OlmstedORGO_BaldwinUnderConstruction_15051069431_5299fefb0a_o.jpg
    caption: "Construction of Baldwin Auditorium."
    credit: Courtesy of the United States Department of the Interior, National Park Service, Frederick Law Olmsted National Historic Site.
    alt: "Construction scene. Equipment and materials in the foreground with a dorm on the left and an auditorium with partially constructed steel dome on the right."

  - id: "vid-1"
    poster: figures/evans-video-still.jpg
    media_id: BpGN0UUtqqU
    media_type: youtube
    label: "Video 1"
    caption: "A selection of Walker Evans photos from the across the United States of America, 1930s."
    credit: The J. Paul Getty Museum, Los Angeles
    alt: "A narrow, unmarked paved road stretching away diagonally from the bottom right. On one side a row of houses and multi-pronged telegraph or electrical poles, on the other side a gas station sign and single car and figure."

  - id: "table-1"
    src: "tables/evans-works.html"
    media_type: table

  - id: "audio-1"
    media_id: "748443409"
    media_type: soundcloud
    label: "Audio 1"
    caption: "*Modern Art Notes Podcast*, episode 429, “Dorothea Lange, Soul of a Nation,” hosted by Tyler Green, https://soundcloud.com/manpodcast/ep429."

  - id: "cat-1"
    src: figures/lange-mother-a.jpg
    caption: "Dorothea Lange, *Human Erosion in California / Migrant Mother*, 1936."
    credit: The J. Paul Getty Museum, Los Angeles
    download: true
    zoom: true
    alt: "Close in shot of a mother with her hand to her cheek, two children pressed against either side but turned away, a baby just visible on her lap."

  - id: "mother-variants"
    label: "Figure 1.1"
    caption: "Alternate versions of Dorothea Lange’s *Migrant Mother*, 1936."
    credit: "Library of Congress Prints and Photographs Division"
    annotations:
      - input: radio
        items:
        - src: figures/lange-mother-b.jpg
          label: "Variant #1"
        - src: figures/lange-mother-c.jpg
          label: "Variant #2"

  - id: "mother-annotations"
    src: "figures/lange-layers/base.jpg"
    zoom: true
    label: "Figure 1.2"
    caption: "This version of the print from the Library of Congress Prints and Photographs Division is mounted on paper board and includes an original FSA label. Note too the thumb seen in the lower right corner. It is also visible in the Getty‘s print, but Lange’s negative was later retouched to remove the thumb and in later prints, it is only a ghostly shadow."
    annotations:
      - input: checkbox
        items:
          - src: "figures/lange-layers/original-label.png"
            selected: true
          - src: "figures/lange-layers/additional-label.png"
          - src: "figures/lange-layers/scratches.png"
          - src: "figures/lange-layers/thumb.png"
            selected: true

  - id: "cat-2"
    src: figures/evans-fields-family-a.jpg
    caption: "Walker Evans, *Bud Fields with His Wife Ivy, and His Daughter Ellen, Hale County, Alabama*, 1936."
    credit: The J. Paul Getty Museum, Los Angeles
    download: true
    zoom: true
    alt: "A woman seated in a bed nursing a child, a man on a chair beside them, in a room with plain wooden floor and walls, both barefoot and staring at the camera."

  - id: "cat-2-b"
    src: figures/evans-fields-family-b.jpg
    caption: "Walker Evans, *Sharecropper's Family, Hale County, Alabama / Bud Fields and His Family, Hale County, Alabama / Bud Woods and His Family*, 1936."
    credit: The J. Paul Getty Museum, Los Angeles
    alt: "Parents and four children of varying ages, seated and posing for the camera in a room with plain wooden floor and walls."

  - id: "cat-2-c"
    src: figures/evans-bud-fields.jpg
    caption: "Walker Evans, * [William Edward (Bud) Fields, A Cotton Sharecropper, Hale County, Alabama]/[Bud Woods, Tenant Farmer]*, 1936."
    credit: The J. Paul Getty Museum, Los Angeles
    alt: "Portrait of a bare-chested moustached man, with a patterned bandana draped over his shoulders, photographed from the chest up, staring straight into the camera."
